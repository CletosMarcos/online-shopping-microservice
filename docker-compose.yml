
services:

#  Product Service

  # Service Build
  product-service:
    build:
      context: ./product-service
    ports:
      - "8080:8080"
    depends_on:
      - product-mongodb
    networks:
      - microservices-net

  # Compose Services
  product-mongodb:
    image: mongo:7.0.5
    container_name: mongodb_product_db_ms
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: product-service
    volumes:
      - ./data:/data/db

# ________________________________________________________

# Inventory Service

  # Service Build
  inventory-service:
    build:
      context: ./inventory-service
    ports:
      - "8082:8082"
    depends_on:
      - inventory-mysql
    networks:
      - microservices-net

  # Compose Services
  inventory-mysql:
    image: mysql:8.3.0
    container_name: mysql_inventory_db_ms
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3316:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql


# ________________________________________________________

# Order Service

  # Service Build
  order-service:
    build:
      context: ./order-service
    ports:
      - "8081:8081"
    depends_on:
      - order-mysql
      - broker
      - zookeeper
      - kafka-ui
    networks:
      - microservices-net

  # Compose Services
  order-mysql:
    image: mysql:8.3.0
    container_name: mysql_order_db_ms
    environment:
      MYSQL_ROOT_PASSWORD: mysql
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper_ms
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker_ms
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    container_name: kafka-ui_ms
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8086:8080"
    depends_on:
      - broker
    environment:
      KAFKA_CLUSTERS_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: broker:29092
      DYNAMIC_CONFIG_ENABLED: 'true'

  # ________________________________________________________

# Review Service

  # Service Build
  review-service:
    build:
      context: ./review-service
    ports:
      - "8084:8084"
    depends_on:
      - review-mysql
    networks:
      - microservices-net

  # Compose Services
  review-mysql:
    image: mysql:8.3.0
    container_name: mysql_review_db_ms
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: review_service_db
    ports:
      - "3326:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql


  # ________________________________________________________

  # API-Gateway

  # Service Build
  api-gateway:
    build:
      context: ./api-gateway
    ports:
      - "9000:9000"
    networks:
      - microservices-net
    depends_on:
      - keycloak-mysql
      - keycloak
#      - notification-service
#      - order-service
#      - product-service
#      - review-service
#      - inventory-service

  # Compose Services
  keycloak-mysql:
    container_name: keycloak-mysql_ms
    image: mysql:8.3.0
    volumes:
      - ./volume-data/mysql_keycloak_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
  keycloak:
    container_name: keycloak_ms
    image: quay.io/keycloak/keycloak:24.0.1
    command: [ "start-dev", "--import-realm" ]
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8181:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql

  # ________________________________________________________

networks:
  microservices-net:
    driver: bridge